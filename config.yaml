# Configuration

# LLM settings
llm:
  model: claude-3-5-sonnet-20241022
  temperature: 0.0
  max_tokens: 1000

# Matching tolerances
tolerances:
  amount_exact: 0.01      # paisa-level slack for "same amount"
  tds_rates: [0.02, 0.10] # both statutory rates in use — 0.02 alone misses ~half
  tds_tolerance: 1.00     # ₹ rounding slack on the computed TDS
  bank_charge_min: 50     # Minimum bank charge (₹)
  bank_charge_pct: 0.005  # Bank charge as percentage
  # R6: how far above gross a credit may sit and still be read as "this invoice,
  # rounded up / paid in advance". Beyond it the excess is bigger than the story
  # it is meant to explain, and the credit belongs to something else entirely.
  overpay_max_ratio: 1.25

# Date matching
dates:
  max_days_gap: 7  # Maximum days between invoice and transaction

# Confidence thresholds
thresholds:
  auto_match: 0.95  # Min confidence to auto-match
  exception: 0.50   # Min confidence to attempt LLM resolution

# Per-rule base confidence, compared against the thresholds above.
# A cited invoice number corroborates the amount, so it scores higher.
#
# These are not vibes. Each is set from the precision that tier actually
# measured on batch_dev (see reports/), rounded down and then placed either side
# of thresholds.auto_match so that a tier posting below the bar is a deliberate
# statement that a human should look, not an accident of arithmetic.
confidence:
  r1_exact: 0.97
  r1_exact_with_ref: 0.99

  # R4: a 2-4 invoice sum landing on the paisa, with no second combination that
  # also works. Coincidence is close to impossible, hence a rate near R1's.
  r4_subset: 0.96
  r4_subset_with_ref: 0.98

  # R3: the invoice is identified AND the gap has a named cause. TDS scores
  # above bank charges because a delta of exactly 2% or 10% of gross is a much
  # narrower target than "at most max(Rs50, 0.5%)".
  r3_tds: 0.96
  r3_tds_with_ref: 0.98
  r3_charges: 0.95
  r3_charges_with_ref: 0.97

  # R6: invoice settled in full, excess left unapplied. With the invoice number
  # quoted this is as solid as an exact match. Without one it is the reading
  # that competes with "part payment of a bigger invoice", so it goes to a
  # human -- the rule only offers it at all when no larger invoice is in view.
  r6_overpaid_with_ref: 0.96
  r6_overpaid_named: 0.90

  # R5: short by an amount nothing accounts for. A quoted invoice number still
  # identifies the payer, so the match itself is sound and posts automatically.
  # Without one, a fuzzy counterparty name is all that ties the payment to the
  # invoice -- deliberately parked below auto_match so it reaches a human.
  r5_underpaid_with_ref: 0.95
  r5_underpaid_named: 0.72

# Exception handling
exceptions:
  max_per_batch: 100  # Max exceptions to queue
  llm_timeout: 30    # Seconds

blocking:
  name_min: 70          # fuzzy score to accept a counterparty
  # Deliberately equal to name_min. A name good enough to admit a candidate is
  # good enough to corroborate its amount -- a gap between the two would trust
  # the same evidence for one decision and distrust it for the other.
  name_strong: 70
  date_back_days: 75    # invoice can be this old
  date_fwd_days: 10     # ...or this far in the future
  amount_lo: 0.80       # invoice gross × this, for a bare narration
  # A named counterparty or a quoted invoice number tells us *who* paid, so the
  # amount no longer has to carry the identification on its own. Part-payments
  # in batch_dev run down to 0.31 of gross; 0.80 discards every one of them.
  amount_lo_corroborated: 0.30
  amount_hi: 1.25
  # A wrong shortlist entry is cheap -- a rule rejects it. A dropped one can
  # never be matched by anything. Measured on batch_dev: 8 evicts 24 true links,
  # 20 evicts 6 (5 of them CONSOLIDATED, which the group path handles), and 30
  # evicts 2 for 50% more LLM context than it is worth.
  max_candidates: 20
  max_ref_digits: 5     # longer digit-runs are UTRs, not invoices

  # Consolidated path: one credit settling several invoices at once.
  group_max_size: 4       # observed groups run 2-4; beyond that the search
                          # explodes and the evidence gets thin anyway
  # A customer clearing a backlog in one transfer reaches further back than a
  # customer paying a single invoice, so the group path gets its own window.
  # A subset summing to the paisa is strong enough evidence to carry the extra
  # reach; the single-invoice path would just collect noise.
  group_date_back_days: 120
  group_max_results: 5    # more distinct subsets than this is not a ranking
                          # problem, it is an ambiguous transaction -- R4
                          # abstains and it goes to the exception queue
