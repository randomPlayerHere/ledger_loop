[project]
name = "ledger-loop"
version = "0.1.0"
description = "Autonomous bank-statement to ledger reconciliation agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

# makes `python -m ledgerloop.run` work instead of `python -m src.ledgerloop.run`
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerloop"]
